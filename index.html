		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0a0720;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---------- tela de carregamento ---------- */
#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 50% 40%, #1d1050 0%, #120b33 45%, #0a0720 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: clamp(14px, 3.4vh, 32px);
	visibility: hidden;
	font-family: 'Press Start 2P', 'Courier New', monospace;
	image-rendering: pixelated;
	overflow: hidden;
	z-index: 5;
}

#stars { position: absolute; inset: 0; pointer-events: none; }
.star {
	position: absolute;
	width: 2px;
	height: 2px;
	background: #fff;
	opacity: .15;
	animation: twinkle 2.4s steps(3, end) infinite;
}
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }

.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

#studio {
	width: min(88vw, 540px);
	animation: floaty 3s steps(6, end) infinite;
}
#slot { position: relative; width: min(88vw, 560px); min-height: clamp(170px, 30vh, 240px); }
#reveal {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: clamp(10px, 2.2vh, 20px);
	opacity: 0;
	transition: opacity .6s;
	pointer-events: none;
}
#reveal.on { opacity: 1; }
#presents {
	font-size: clamp(7px, 1.5vh, 10px);
	color: #8a84c8;
	letter-spacing: 2px;
}
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

#game-logo { width: min(86vw, 548px); }

#loader { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: min(80vw, 460px); text-align: center; display: none; }
#bar {
	display: grid;
	grid-template-columns: repeat(24, 1fr);
	gap: 3px;
	padding: 5px;
	background: #120a30;
	border: 3px solid #6a5bd0;
	box-shadow: 0 0 0 3px #0a0720, 0 0 18px #6a5bd055;
}
#bar i { height: clamp(10px, 2vh, 16px); background: #2a2060; }
#bar i.on { background: linear-gradient(#b8ffe6, #5adcae 55%, #2c9c80); }
#pct { margin-top: 14px; font-size: clamp(8px, 1.6vh, 11px); color: #9bffd0; }
#hint { margin-top: 10px; font-size: clamp(6px, 1.3vh, 8px); color: #6a64a8; line-height: 1.8; }

#start { text-align: center; cursor: pointer; }
#start b {
	display: block;
	font-size: clamp(11px, 2.4vh, 18px);
	color: #ffe066;
	text-shadow: 3px 3px 0 #140a3a;
	animation: blink 1s steps(2, end) infinite;
}
#start small { display: block; margin-top: 14px; font-size: clamp(6px, 1.3vh, 8px); color: #6a64a8; line-height: 1.8; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }

#status-notice {
	display: none;
	background: #3a1830;
	border: 3px solid #ff5a7a;
	color: #ffd0da;
	font-size: 9px;
	line-height: 1.9;
	margin: 0 1.5rem;
	padding: 1rem;
	text-align: center;
	max-width: 560px;
	z-index: 1;
}
#credits {
	position: absolute;
	bottom: 12px;
	left: 0;
	right: 0;
	text-align: center;
	font-size: 7px;
	color: #4f4a8a;
}

(function () {
	function kick() { try { window.dispatchEvent(new Event('resize')); } catch (e) { /* ignora */ } }
	function kickSoon() { [0, 150, 400, 900, 1800].forEach((d) => setTimeout(kick, d)); }
	document.addEventListener('fullscreenchange', kickSoon);
	document.addEventListener('webkitfullscreenchange', kickSoon);
	window.addEventListener('orientationchange', kickSoon);
	setInterval(function () {
		const c = document.getElementById('canvas');
		if (!c || !c.width) { return; }
		const w = Math.round(window.innerWidth * window.devicePixelRatio);
		const h = Math.round(window.innerHeight * window.devicePixelRatio);
		if (Math.abs(c.width - w) > 2 || Math.abs(c.height - h) > 2) { kick(); }
	}, 500);
}());

		const s = document.createElement('div');
		s.className = 'star';

	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Falha ao registrar o service worker.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'ERRO\nEste navegador nao tem recursos necessarios para rodar o jogo:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		setProgress(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setProgress(current / total);
				}
			},
		}).then(() => {
			// o jogo ja esta rodando por tras da tela; espera o jogador para liberar o audio
			setProgress(1);
			setStatusMode('ready');
			let begun = false;
			function begin() {
				if (begun) { return; }
				begun = true;
				(window.__audioCtxs || []).forEach((c) => { try { c.resume(); } catch (e) { /* ignora */ } });
				window.__catStarted = true;   // o jogo (GDScript) le este sinal e inicia a musica
				statusOverlay.style.transition = 'opacity .35s';
				statusOverlay.style.opacity = '0';
				setTimeout(() => setStatusMode('hidden'), 360);
			}
			statusOverlay.addEventListener('pointerdown', begin);
			// captura a tecla antes do jogo: ela so inicia, sem tambem acionar o menu
			window.addEventListener('keydown', function (e) {
				if (!begun) { e.stopImmediatePropagation(); e.preventDefault(); }
				begin();
			}, true);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
